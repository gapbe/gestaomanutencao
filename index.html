<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    
    <!-- ======================================================= -->
    <!-- CONFIGURAÇÕES PWA (WEB APP NATIVO PARA MOBILE)          -->
    <!-- ======================================================= -->
    
    <!-- Força a escala correta no mobile e impede o zoom duplo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Configurações para iOS (Apple) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Manutenção ATIC">
    
    <!-- Cor da barra superior (Android) -->
    <meta name="theme-color" content="#1A365D">
    
    <!-- Ícone que aparecerá na tela do telemóvel -->
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1hLHrX8zWkOv6Z6NRPUGHi2Q1MMisdvcs">
    
    <!-- Script Dinâmico que gera o Manifest do App (Android/iOS) -->
    <script>
      // PAINEL DE CONFIGURAÇÃO DA OM
      const OM_CONFIG = {
        // ⚠️ ATENÇÃO: COLE A URL DO SEU APPS SCRIPT ABAIXO (A mesma que você gerou na Fase 1)
        API_URL: "https://script.google.com/macros/s/AKfycbyM4Dbtjmn-ri_08ebTwakvX00qF0t1Oz1wj-YKuqW816OasWQCmEw7wV9up9hAqWEJ0A/exec", 
        SIGLA: "ATIC",
        COR_PRIMARIA: "#1A365D",
        LOGO: "https://lh3.googleusercontent.com/d/1hLHrX8zWkOv6Z6NRPUGHi2Q1MMisdvcs"
      };

      document.addEventListener("DOMContentLoaded", function() {
        const manifest = {
          "name": "Manutenção " + OM_CONFIG.SIGLA,
          "short_name": "Manutenção",
          "start_url": window.location.href, 
          "display": "standalone", // Oculta a barra do navegador
          "background_color": "#f4f6f9",
          "theme_color": OM_CONFIG.COR_PRIMARIA,
          "icons": [{
            "src": OM_CONFIG.LOGO,
            "sizes": "512x512",
            "type": "image/png"
          }]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.querySelector('head').insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(blob)}">`);
      });
    </script>
    <!-- ======================================================= -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
      /* CSS RESET: Ocupação total da tela para Mobile */
      html, body { 
        width: 100%; 
        min-height: 100vh; 
        margin: 0; 
        padding: 0; 
        overflow-x: hidden; 
        background-color: #f4f7f6; 
        font-family: 'Segoe UI', Tahoma, sans-serif; 
      }
      
      .app-header { background-color: #1A365D; color: white; padding: 15px; border-bottom: 4px solid #2B6CB0; }
      .container-app { padding: 15px; padding-bottom: 40px; }
      .card { border-radius: 12px; border: none; }
      .sugestao-item { cursor: pointer; font-size: 0.9rem; }
      .sugestao-item:hover { background-color: #f8f9fa; font-weight: bold; }
      
      @media (max-width: 576px) {
        .container-app { padding: 10px 0; }
        .card { border-radius: 0; border-left: none; border-right: none;}
        .table-responsive { font-size: 0.85rem; }
      }
    </style>
  </head>
  <body>
    
    <!-- CABEÇALHO ESTILO APLICATIVO NATIVO -->
    <div class="app-header shadow-sm sticky-top">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold"><i class="bi bi-pc-display"></i> Manutenção ATIC</h5>
        <button class="btn btn-sm btn-outline-light border-0" onclick="window.location.reload()"><i class="bi bi-arrow-clockwise fs-5"></i></button>
      </div>
    </div>

    <div class="container-app">
      <div class="d-flex justify-content-end mb-3 px-2 px-md-0">
        <button class="btn btn-warning fw-bold text-dark shadow-sm w-100 py-3" onclick="abrirModalEntrada()">📥 REGISTRAR NOVA ENTRADA</button>
      </div>

      <div class="card shadow-sm border-0 border-top border-4 border-dark">
        <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2 py-3">
          <h6 class="mb-0 fw-bold text-dark d-flex align-items-center"><i class="bi bi-list-task me-2"></i> Equipamentos <span class="badge bg-secondary ms-2" id="contadorEqp">0</span></h6>
          <div class="d-flex gap-2 w-100 mt-2 mt-md-0">
            <select id="filtroStatusEqp" class="form-select form-select-sm" style="max-width: 130px;" onchange="filtrarTabelaEqp()">
              <option value="TODOS">Todos</option>
              <option value="NA OFICINA" selected>Na Oficina</option>
              <option value="DEVOLVIDO">Devolvidos</option>
            </select>
            <input type="text" id="buscaEqp" class="form-control form-control-sm flex-grow-1" placeholder="🔍 Buscar..." onkeyup="filtrarTabelaEqp()">
          </div>
        </div>
        <div class="card-body p-0 table-responsive">
          <table class="table table-hover align-middle mb-0 text-center">
            <thead class="table-light">
              <tr><th>ENTRADA</th><th>CLIENTE</th><th>EQUIPAMENTO</th><th>STATUS</th><th>AÇÕES</th></tr>
            </thead>
            <tbody id="tabelaEqpCorpo">
              <tr><td colspan="5" class="py-4 text-muted"><div class="spinner-border spinner-border-sm text-secondary"></div> Conectando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- MODAL ENTRADA -->
    <div class="modal fade" id="modalEntrada" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-fullscreen-sm-down">
        <div class="modal-content border-0">
          <div class="modal-header bg-warning">
            <h5 class="modal-title fw-bold text-dark"><i class="bi bi-box-arrow-in-right"></i> Nova Entrada</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <form id="formEntrada" onsubmit="processarEntrada(event)">
              <div class="mb-3 text-start">
                <label class="form-label fw-bold">Entregue por (Nome/Setor)</label>
                <input type="text" class="form-control form-control-lg" id="eqpCliente" required>
              </div>
              
              <div class="mb-3 text-start position-relative">
                <label class="form-label fw-bold">Recebido por (Técnico ATIC)</label>
                <input type="text" class="form-control form-control-lg" id="eqpTecnico" required placeholder="Digite as iniciais..." autocomplete="off" onkeyup="filtrarTecnicos('eqpTecnico', 'lista-tecnicos-entrada')" onclick="filtrarTecnicos('eqpTecnico', 'lista-tecnicos-entrada')">
                <ul class="list-group position-absolute w-100 shadow" id="lista-tecnicos-entrada" style="display: none; z-index: 1050; max-height: 180px; overflow-y: auto;"></ul>
              </div>
              
              <div class="bg-light p-3 rounded mb-3 border">
                <p class="mb-2 fw-bold text-secondary"><small>CONTATOS DO CLIENTE</small></p>
                <div class="mb-2 text-start"><label class="form-label fw-bold">WhatsApp</label><input type="tel" class="form-control" id="eqpCelular" required oninput="formatarCelular(this)" maxlength="15"></div>
                <div class="mb-2 text-start"><label class="form-label fw-bold">E-mail</label><input type="email" class="form-control" id="eqpEmail" required></div>
              </div>
              <div class="mb-3 text-start"><label class="form-label fw-bold">Equipamentos</label><textarea class="form-control" id="eqpDescricao" rows="2" required></textarea></div>
              <div class="mb-3 text-start"><label class="form-label fw-bold">Problema Relatado</label><textarea class="form-control" id="eqpProblema" rows="2" required></textarea></div>
              <div class="d-grid mt-4"><button type="submit" class="btn btn-warning fw-bold text-dark btn-lg py-3 shadow-sm" id="btnSalvarEntrada">Confirmar Entrada</button></div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL SAÍDA -->
    <div class="modal fade" id="modalSaida" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
        <div class="modal-content border-0">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title fw-bold"><i class="bi bi-box-arrow-right"></i> Devolução</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4 text-start">
            <form id="formSaida" onsubmit="processarSaida(event)">
              <input type="hidden" id="saidaLinha">
              
              <div class="mb-3 position-relative">
                <label class="form-label fw-bold">Técnico que está devolvendo</label>
                <input type="text" class="form-control form-control-lg" id="saidaTecnico" required placeholder="Digite as iniciais..." autocomplete="off" onkeyup="filtrarTecnicos('saidaTecnico', 'lista-tecnicos-saida')" onclick="filtrarTecnicos('saidaTecnico', 'lista-tecnicos-saida')">
                <ul class="list-group position-absolute w-100 shadow" id="lista-tecnicos-saida" style="display: none; z-index: 1050; max-height: 180px; overflow-y: auto;"></ul>
              </div>
              
              <div class="mb-4"><label class="form-label fw-bold">Cliente que está recebendo</label><input type="text" class="form-control form-control-lg" id="saidaCliente" required></div>
              <div class="d-grid mt-4"><button type="submit" class="btn btn-success fw-bold btn-lg py-3 shadow-sm" id="btnSalvarSaida">Concluir Devolução</button></div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAIS ELEGANTES GLOBAIS -->
    <div class="modal fade" id="modalAviso" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow-lg"><div class="modal-header bg-success text-white" id="modalAvisoHeader"><h5 class="modal-title fw-bold"><i class="bi bi-check-circle"></i> Sucesso</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body text-center fs-5 py-4" id="modalAvisoBody"></div><div class="modal-footer justify-content-center border-0"><button type="button" class="btn btn-secondary w-75 fw-bold py-2" data-bs-dismiss="modal">OK</button></div></div></div></div>
    
    <div class="modal fade" id="modalZap" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-success shadow-lg"><div class="modal-header bg-success text-white"><h5 class="modal-title fw-bold"><i class="bi bi-whatsapp"></i> WhatsApp</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body text-center fs-5 py-4"><p id="modalZapBody" class="mb-2"></p><p class="fw-bold text-success mt-3">Deseja enviar o comprovante via WhatsApp agora?</p></div><div class="modal-footer d-flex justify-content-between border-0"><button type="button" class="btn btn-secondary w-25 py-2 fw-bold" data-bs-dismiss="modal">Não</button><button type="button" class="btn btn-success w-50 py-2 fw-bold shadow-sm" id="btnConfirmaZap">Sim, Enviar</button></div></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let modalAvisoObj, modalZapObj, linkZapPendente = "";
      let modalInstanceEntrada, modalInstanceSaida;
      let listaEqpCache = [], listaTecnicosCache = []; 

      // ==========================================
      // MOTOR DA API PWA (FETCH)
      // ==========================================
      async function chamarBackend(acao, parametros = {}) {
        const resposta = await fetch(OM_CONFIG.API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: acao, ...parametros })
        });
        const resultado = await resposta.json();
        if (resultado.status === "success") return resultado.data;
        else throw new Error(resultado.message);
      }

      window.onload = function() {
        modalAvisoObj = new bootstrap.Modal(document.getElementById('modalAviso'));
        modalZapObj = new bootstrap.Modal(document.getElementById('modalZap'));
        carregarTabelaEqp();
      };

      function mostrarAviso(msg, tipo = 'success') {
        let header = document.getElementById('modalAvisoHeader');
        if(tipo === 'error') {
            header.className = 'modal-header bg-danger text-white';
            header.innerHTML = '<h5 class="modal-title fw-bold"><i class="bi bi-exclamation-octagon"></i> Erro</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>';
        } else {
            header.className = 'modal-header bg-success text-white';
            header.innerHTML = '<h5 class="modal-title fw-bold"><i class="bi bi-check-circle"></i> Sucesso</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>';
        }
        document.getElementById('modalAvisoBody').innerHTML = msg;
        modalAvisoObj.show();
      }

      function confirmarZap(msg, link) {
        document.getElementById('modalZapBody').innerHTML = msg;
        linkZapPendente = link;
        modalZapObj.show();
      }

      document.getElementById('btnConfirmaZap').addEventListener('click', function() {
        modalZapObj.hide();
        if(linkZapPendente) window.open(linkZapPendente, '_blank');
      });

      function formatarCelular(input) {
        let valor = input.value.replace(/\D/g, "");
        if (valor.length > 11) valor = valor.slice(0, 11);
        if (valor.length > 2) valor = "(" + valor.substring(0, 2) + ") " + valor.substring(2);
        if (valor.length > 9) valor = valor.substring(0, 10) + "-" + valor.substring(10);
        input.value = valor;
      }

      function carregarTabelaEqp() {
        chamarBackend('obterListaTecnicos')
          .then(tecnicos => {
             listaTecnicosCache = tecnicos || [];
             return chamarBackend('listarEquipamentos');
          })
          .then(dados => {
             listaEqpCache = dados || [];
             filtrarTabelaEqp();
          })
          .catch(e => mostrarAviso("Erro de conexão: " + e.message, 'error'));
      }

      function filtrarTecnicos(inputId, listaId) {
        let input = document.getElementById(inputId);
        let termo = input.value.toUpperCase();
        let lista = document.getElementById(listaId);
        lista.innerHTML = '';
        
        if (termo.length < 1 && event.type === 'keyup') {
          lista.style.display = 'none'; return;
        }

        let filtrados = listaTecnicosCache.filter(t => t.toUpperCase().includes(termo));
        if (filtrados.length > 0) {
          lista.style.display = 'block';
          filtrados.forEach(t => {
            let li = document.createElement('li');
            li.className = 'list-group-item sugestao-item border-primary border-top-0 border-end-0 border-bottom-1 border-start-0 py-3';
            li.innerText = t;
            li.onclick = function() { input.value = t; lista.style.display = 'none'; };
            lista.appendChild(li);
          });
        } else {
          lista.style.display = 'none';
        }
      }

      document.addEventListener('click', function(e) {
        if (e.target.id !== 'eqpTecnico') { let l1 = document.getElementById('lista-tecnicos-entrada'); if(l1) l1.style.display = 'none'; }
        if (e.target.id !== 'saidaTecnico') { let l2 = document.getElementById('lista-tecnicos-saida'); if(l2) l2.style.display = 'none'; }
      });

      function filtrarTabelaEqp() {
        const termo = String(document.getElementById('buscaEqp').value).toLowerCase();
        const status = document.getElementById('filtroStatusEqp').value;
        const filtrados = listaEqpCache.filter(i => {
          const mTermo = String(i.clienteEntregou).toLowerCase().includes(termo) || String(i.equipamentos).toLowerCase().includes(termo) || String(i.tecnicoRecebeu).toLowerCase().includes(termo);
          const mStatus = (status === "TODOS" || i.status === status);
          return mTermo && mStatus;
        });
        renderizarTabelaEqp(filtrados);
      }

      function renderizarTabelaEqp(lista) {
        const tbody = document.getElementById('tabelaEqpCorpo');
        document.getElementById('contadorEqp').innerText = lista ? lista.length : 0;
        
        if (!lista || lista.length === 0) { 
            tbody.innerHTML = '<tr><td colspan="5" class="py-4 text-muted">Nenhum equipamento localizado.</td></tr>'; 
            return; 
        }
        
        let html = '';
        lista.forEach(item => {
          let isOficina = (item.status === "NA OFICINA");
          let bColor = isOficina ? "bg-warning text-dark" : "bg-success";
          let dataSplit = item.dataEntrada.split(" ");
          let dataExibicao = dataSplit[0].substring(0,5); // Apenas DD/MM
          
          let btnZap = "";
          if (item.celular && item.celular.length >= 10) {
            let celL = item.celular.replace(/\D/g, "");
            let msgZ = isOficina 
              ? `*Comprovante - ATIC GAP-BE* 🛡️\n\nOlá *${item.clienteEntregou}*,\nReenviando recibo.\n\n*Data:* ${item.dataEntrada}\n*Eqp:* ${item.equipamentos}\n*Téc:* ${item.tecnicoRecebeu}`
              : `*Devolução - ATIC GAP-BE* 📤\n\nReenviando devolução.\n\n*Eqp:* ${item.equipamentos}\n*Téc:* ${item.tecnicoDevolveu}`;
            let linkZ = "https://wa.me/55" + celL + "?text=" + encodeURIComponent(msgZ);
            btnZap = `<button class="btn btn-sm btn-outline-success me-1 py-1 px-2" onclick="window.open('${linkZ}', '_blank')"><i class="bi bi-whatsapp"></i></button>`;
          }

          let btnEmail = (item.email && item.email.includes("@")) 
            ? `<button class="btn btn-sm btn-outline-primary me-1 py-1 px-2" onclick="acionarReenvioEmail(${item.linha})"><i class="bi bi-envelope"></i></button>` : "";

          let btnSaida = isOficina 
            ? `<button class="btn btn-sm btn-success fw-bold ms-1 py-1 px-2" onclick="abrirModalSaida(${item.linha})"><i class="bi bi-box-arrow-right"></i></button>` 
            : `<i class="bi bi-check-circle-fill text-success ms-2 fs-5"></i>`;

          html += `<tr>
            <td class="fw-bold text-secondary">${dataExibicao}</td>
            <td class="fw-bold">${item.clienteEntregou}</td>
            <td class="text-truncate" style="max-width:120px;">${item.equipamentos}</td>
            <td><span class="badge ${bColor}">${item.status}</span></td>
            <td class="text-nowrap">${btnZap}${btnEmail}${btnSaida}</td>
          </tr>`;
        });
        tbody.innerHTML = html;
      }

      function acionarReenvioEmail(linha) {
        mostrarAviso("⏳ Solicitando reenvio de e-mail ao servidor...", "success");
        chamarBackend('reenviarEmailEquipamento', { linha: linha })
          .then(r => mostrarAviso(r.mensagem, 'success'))
          .catch(e => mostrarAviso("Falha: " + e.message, 'error'));
      }

      function abrirModalEntrada() {
        document.getElementById('formEntrada').reset();
        if(!modalInstanceEntrada) modalInstanceEntrada = new bootstrap.Modal(document.getElementById('modalEntrada')); 
        modalInstanceEntrada.show();
      }
      
      function abrirModalSaida(linha) {
        document.getElementById('formSaida').reset(); 
        document.getElementById('saidaLinha').value = linha; 
        if(!modalInstanceSaida) modalInstanceSaida = new bootstrap.Modal(document.getElementById('modalSaida')); 
        modalInstanceSaida.show();
      }

      function processarEntrada(event) {
        event.preventDefault();
        const btn = document.getElementById("btnSalvarEntrada"); 
        btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processando...';
        
        const dados = { 
          cliente: document.getElementById("eqpCliente").value, tecnico: document.getElementById("eqpTecnico").value, 
          celular: document.getElementById("eqpCelular").value, email: document.getElementById("eqpEmail").value, 
          descricao: document.getElementById("eqpDescricao").value, problema: document.getElementById("eqpProblema").value 
        };
        
        chamarBackend('salvarEntradaEquipamento', { dados: dados })
          .then(r => {
            modalInstanceEntrada.hide(); carregarTabelaEqp();
            if (r.linkZap !== "") confirmarZap(r.mensagem, r.linkZap); else mostrarAviso(r.mensagem, 'success');
            btn.disabled = false; btn.innerHTML = 'Confirmar Entrada';
          })
          .catch(e => {
            mostrarAviso("❌ Falha crítica: " + e.message, 'error');
            btn.disabled = false; btn.innerHTML = 'Confirmar Entrada';
          });
      }

      function processarSaida(event) {
        event.preventDefault();
        const btn = document.getElementById("btnSalvarSaida"); 
        btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Dando Baixa...';
        
        const dados = { 
          linha: document.getElementById("saidaLinha").value, 
          tecEntregou: document.getElementById("saidaTecnico").value, 
          clienteRecebeu: document.getElementById("saidaCliente").value 
        };
        
        chamarBackend('registrarSaidaEquipamento', { dados: dados })
          .then(r => {
            modalInstanceSaida.hide(); carregarTabelaEqp();
            if (r.linkZap !== "") confirmarZap(r.mensagem, r.linkZap); else mostrarAviso(r.mensagem, 'success');
            btn.disabled = false; btn.innerHTML = 'Concluir Devolução';
          })
          .catch(e => {
            mostrarAviso("❌ Falha crítica: " + e.message, 'error');
            btn.disabled = false; btn.innerHTML = 'Concluir Devolução';
          });
      }
    </script>
  </body>
</html>
