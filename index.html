<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    
    <!-- ======================================================= -->
    <!-- CONFIGURAÇÕES PWA (WEB APP NATIVO PARA MOBILE)          -->
    <!-- ======================================================= -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Manutenção ATIC">
    <meta name="theme-color" content="#1A365D">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1hLHrX8zWkOv6Z6NRPUGHi2Q1MMisdvcs">
    
    <script>
      const OM_CONFIG = {
        // ⚠️ ATENÇÃO: COLE A URL DO SEU APPS SCRIPT ABAIXO TERMINADA EM /exec
        API_URL: "https://script.google.com/macros/s/AKfycbyM4Dbtjmn-ri_08ebTwakvX00qF0t1Oz1wj-YKuqW816OasWQCmEw7wV9up9hAqWEJ0A/exec", 
        SIGLA: "ATIC",
        COR_PRIMARIA: "#1A365D",
        LOGO: "https://lh3.googleusercontent.com/d/1hLHrX8zWkOv6Z6NRPUGHi2Q1MMisdvcs"
      };

      document.addEventListener("DOMContentLoaded", function() {
        const manifest = {
          "name": "Manutenção " + OM_CONFIG.SIGLA,
          "short_name": "Manutenção",
          "start_url": window.location.href, 
          "display": "standalone",
          "background_color": "#f4f6f9",
          "theme_color": OM_CONFIG.COR_PRIMARIA,
          "icons": [{
            "src": OM_CONFIG.LOGO,
            "sizes": "512x512",
            "type": "image/png"
          }]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.querySelector('head').insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(blob)}">`);
      });
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
      /* CSS RESET E LAYOUT MOBILE PWA */
      html, body { 
        width: 100%; min-height: 100vh; margin: 0; padding: 0; overflow-x: hidden; 
        background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, sans-serif; 
      }
      .app-header { background-color: #1A365D; color: white; padding: 15px; border-bottom: 4px solid #2B6CB0; }
      .container-app { padding: 15px; padding-bottom: 50px; }
      .card { border-radius: 12px; border: none; }
      .sugestao-item { cursor: pointer; font-size: 0.9rem; padding: 10px 15px; }
      .sugestao-item:hover { background-color: #f8f9fa; font-weight: bold; }
      .btn-acao { padding: 0.30rem 0.6rem; font-size: 0.95rem; margin: 0 2px;}
      
      @media (max-width: 576px) {
        .container-app { padding: 10px 0; }
        .card { border-radius: 0; border-left: none; border-right: none;}
        .table-responsive { font-size: 0.85rem; }
      }
    </style>
  </head>
  <body>
    
    <!-- CABEÇALHO NATIVO -->
    <div class="app-header shadow-sm sticky-top">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold">🖥️ Gestão de Equipamentos</h5>

      </div>

    <!-- ========================================== -->

    <!-- MAIN APP CONTAINER -->

    <!-- MODAIS GLOBAIS DE AVISO E CONFIRMAÇÃO -->
    <div class="modal fade" id="modalAviso" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header bg-success text-white" id="modalAvisoHeader">
            <h5 class="modal-title fw-bold">✅ Sucesso</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body text-center fs-5 py-4" id="modalAvisoBody"></div>
          <div class="modal-footer justify-content-center border-0" id="modalAvisoFooter"></div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalConfirmacao" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-danger shadow-lg">

            <h5 class="modal-title fw-bold">⚠️ Atenção</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body text-center fs-5 py-4" id="modalConfirmacaoBody"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
      let modalInstanceEntrada, modalInstanceSaida, modalInstanceEditar;
      let modalAvisoObj, modalConfirmaObj, linhaParaExcluir = null;
      let listaEqpCache = [], listaTecnicosCache = []; 

      // ==========================================
      // MOTOR DA API PWA (FETCH)
      // ==========================================
      async function chamarBackend(acao, parametros = {}) {
        const resposta = await fetch(OM_CONFIG.API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: acao, ...parametros })
        });
        const resultado = await resposta.json();
        // O Apps Script da Manutenção retorna os dados dentro da própria resposta.
        // Se a chamada envolver "sucesso", repassamos o data inteiro.
        if (resultado.status === "success") return resultado.data;
        else throw new Error(resultado.message);
      }

      window.onload = function() {
        modalInstanceEntrada = new bootstrap.Modal(document.getElementById('modalEntrada'));
        modalInstanceSaida = new bootstrap.Modal(document.getElementById('modalSaida'));
        modalInstanceEditar = new bootstrap.Modal(document.getElementById('modalEditar'));
        modalAvisoObj = new bootstrap.Modal(document.getElementById('modalAviso'));
        modalConfirmaObj = new bootstrap.Modal(document.getElementById('modalConfirmacao'));
        carregarTabelaEqp();
      };

      function formatarCelular(input) {
        let valor = input.value.replace(/\D/g, "");
        if (valor.length > 11) valor = valor.slice(0, 11);
        if (valor.length > 2) valor = "(" + valor.substring(0, 2) + ") " + valor.substring(2);
        if (valor.length > 9) valor = valor.substring(0, 10) + "-" + valor.substring(10);
        input.value = valor;
      }

      function mostrarAviso(msg, tipo = 'success', linkZap = null) {
        let header = document.getElementById('modalAvisoHeader');
        let footer = document.getElementById('modalAvisoFooter');
        
        if(tipo === 'error') {
            header.className = 'modal-header bg-danger text-white';
            header.innerHTML = '<h5 class="modal-title fw-bold">❌ Erro</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>';
        } else if (tipo === 'warning') {
            header.className = 'modal-header bg-warning text-dark';
            header.innerHTML = '<h5 class="modal-title fw-bold">⏳ Processando</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button>';
        } else {
            header.className = 'modal-header bg-success text-white';
            header.innerHTML = '<h5 class="modal-title fw-bold">✅ Sucesso</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>';
        }
        document.getElementById('modalAvisoBody').innerHTML = msg;
        
        if (linkZap && linkZap.includes('wa.me')) {
            footer.innerHTML = `<button type="button" class="btn btn-secondary w-25 fw-bold" data-bs-dismiss="modal">Fechar</button>
                                <a href="${linkZap}" target="_blank" class="btn btn-success w-50 fw-bold" onclick="modalAvisoObj.hide()">💬 Enviar Zap</a>`;
        } else {
            footer.innerHTML = `<button type="button" class="btn btn-secondary w-50 fw-bold" data-bs-dismiss="modal">OK</button>`;
        }
        modalAvisoObj.show();
      }

      function carregarTabelaEqp() {
        document.getElementById('tabelaEqpCorpo').innerHTML = `<tr><td colspan="7" class="py-4 text-muted"><div class="spinner-border spinner-border-sm text-secondary"></div> Conectando API...</td></tr>`;
        
        chamarBackend('obterListaTecnicos')
          .then(tecnicos => {
            listaTecnicosCache = tecnicos || [];
            return chamarBackend('listarEquipamentos');
          })
          .then(dados => {
            listaEqpCache = dados || [];
            filtrarTabelaEqp();
          })
          .catch(e => {
            document.getElementById('tabelaEqpCorpo').innerHTML = `<tr><td colspan="7" class="py-4 text-danger fw-bold">❌ Falha de Conexão: ${e.message}</td></tr>`;
          });
      }

      function filtrarTecnicos(inputObj, listaId) {
        let termo = inputObj.value.toUpperCase();
        let lista = document.getElementById(listaId);
        lista.innerHTML = '';
        if (termo.length < 1 && event.type === 'keyup') { lista.style.display = 'none'; return; }
        
        let filtrados = listaTecnicosCache.filter(t => t.toUpperCase().includes(termo));
        if (filtrados.length > 0) {
          lista.style.display = 'block';
          filtrados.forEach(t => {
            let li = document.createElement('li');
            li.className = 'list-group-item sugestao-item border-primary border-top-0 border-end-0 border-bottom-1 border-start-0';
            li.innerText = t;
            li.onclick = function() { inputObj.value = t; lista.style.display = 'none'; };
            lista.appendChild(li);
          });
        } else { lista.style.display = 'none'; }
      }

      document.addEventListener('click', function(e) {
        document.querySelectorAll('[id^="sug-"]').forEach(l => {
           if(e.target.nextElementSibling !== l) l.style.display = 'none';
        });
      });

      function filtrarTabelaEqp() {
        const termo = String(document.getElementById('buscaEqp').value).toLowerCase();
        const status = document.getElementById('filtroStatusEqp').value;
        const filtrados = listaEqpCache.filter(i => {
          const mTermo = String(i.clienteEntregou).toLowerCase().includes(termo) || String(i.equipamentos).toLowerCase().includes(termo) || String(i.tecnicoManutencao).toLowerCase().includes(termo) || String(i.tecnicoRecebeu).toLowerCase().includes(termo);
          const mStatus = (status === "TODOS" || i.status === status);
          return mTermo && mStatus;
        });
        renderizarTabelaEqp(filtrados);
      }

      function renderizarTabelaEqp(lista) {
        const tbody = document.getElementById('tabelaEqpCorpo');
        document.getElementById('contadorEqp').innerText = lista ? lista.length : 0;
        
        if (!lista || lista.length === 0) { 
            tbody.innerHTML = '<tr><td colspan="7" class="py-4 text-muted">Nenhum equipamento localizado.</td></tr>'; 
            return; 
        }

        try {
          const iconeZap = document.getElementById('svg-zap').innerHTML;
          const iconeEmail = document.getElementById('svg-email').innerHTML;
          const iconeEdit = document.getElementById('svg-edit').innerHTML;
          const iconeDel = document.getElementById('svg-del').innerHTML;
          const iconeSaida = document.getElementById('svg-saida').innerHTML;

          let html = '';
          lista.forEach(item => {
            let bColor = item.status === "NA OFICINA" ? "bg-warning text-dark" : "bg-success";
            let dataExibicao = item.dataEntrada.split(" ")[0].substring(0,5); 
            let tecRec = item.tecnicoRecebeu || '<span class="text-muted small">-</span>';
            let tecMnt = item.tecnicoManutencao || '<span class="text-muted small">-</span>';
            
            let msgZ = (item.status === "NA OFICINA")
              ? "*Comprovante - ATIC GAP-BE* 🛡️\n\nOlá *" + item.clienteEntregou + "*,\nReenviando recibo.\n\n*Data:* " + item.dataEntrada + "\n*Eqp:* " + item.equipamentos + "\n*Téc:* " + item.tecnicoRecebeu
              : "*Devolução - ATIC GAP-BE* 📤\n\nReenviando devolução.\n\n*Eqp:* " + item.equipamentos + "\n*Manutenção:* " + (item.tecnicoManutencao || "-") + "\n*Téc:* " + item.tecnicoDevolveu;
            
            let linkZ = "https://wa.me/55" + item.celular.replace(/\D/g,"") + "?text=" + encodeURIComponent(msgZ);
            linkZ = linkZ.replace(/'/g, "\\'"); 

            let btnZap = (item.celular.length >= 10) ? `<button class="btn btn-outline-success btn-acao d-inline-flex align-items-center justify-content-center" title="WhatsApp" onclick="window.open('${linkZ}', '_blank')">${iconeZap}</button>` : "";
            let btnEmail = (item.email && item.email.includes("@")) ? `<button class="btn btn-outline-info btn-acao d-inline-flex align-items-center justify-content-center" title="Reenviar E-mail" onclick="acionarReenvioEmail(${item.linha})">${iconeEmail}</button>` : "";
            let btnEdit = `<button class="btn btn-outline-primary btn-acao d-inline-flex align-items-center justify-content-center" title="Editar" onclick="abrirModalEditar(${item.linha})">${iconeEdit}</button>`;
            let btnDel = `<button class="btn btn-outline-danger btn-acao d-inline-flex align-items-center justify-content-center" title="Excluir" onclick="excluirRegistroEqp(${item.linha})">${iconeDel}</button>`;
            
            let btnSaida = item.status === "NA OFICINA" 
              ? `<button class="btn btn-success fw-bold btn-acao shadow-sm d-inline-flex align-items-center justify-content-center gap-1" onclick="abrirModalSaida(${item.linha})">${iconeSaida} Saída</button>` 
              : "";

            html += `<tr>
              <td class="fw-bold text-secondary align-middle">${dataExibicao}</td>
              <td class="fw-bold align-middle">${item.clienteEntregou}</td>
              <td class="text-truncate align-middle" style="max-width:120px;" title="${item.equipamentos}">${item.equipamentos}</td>
              <td class="align-middle">${tecRec}</td>
              <td class="align-middle">${tecMnt}</td>
              <td class="align-middle"><span class="badge ${bColor}">${item.status}</span></td>
              <td class="text-nowrap align-middle">${btnZap}${btnEmail}${btnSaida}${btnEdit}${btnDel}</td>
            </tr>`;
          });
          tbody.innerHTML = html;
          
        } catch(err) {
          tbody.innerHTML = `<tr><td colspan="7" class="py-4 text-danger fw-bold">❌ Erro Interno de Renderização: ${err.message}</td></tr>`;
        }
      }

      function acionarReenvioEmail(linha) {
        mostrarAviso("Enviando ordem para o servidor de E-mail...", "warning");
        chamarBackend('reenviarEmailEquipamento', { linha: linha })
          .then(r => mostrarAviso(r.mensagem, r.sucesso ? 'success' : 'error'))
          .catch(e => mostrarAviso("Falha na comunicação: " + e.message, 'error'));
      }

      function abrirModalEntrada() { document.getElementById('formEntrada').reset(); modalInstanceEntrada.show(); }
      function abrirModalSaida(linha) { document.getElementById('formSaida').reset(); document.getElementById('saidaLinha').value = linha; modalInstanceSaida.show(); }
      
      function abrirModalEditar(linha) {
        const item = listaEqpCache.find(i => i.linha === linha);
        document.getElementById('editLinha').value = item.linha;
        document.getElementById('editDataEntrada').value = item.dataEntrada;
        document.getElementById('editClienteEntregou').value = item.clienteEntregou;
        document.getElementById('editCelular').value = item.celular;
        document.getElementById('editEmail').value = item.email;
        document.getElementById('editTecRecebeu').value = item.tecnicoRecebeu;
        document.getElementById('editEquipamentos').value = item.equipamentos;
        document.getElementById('editProblema').value = item.problema;
        document.getElementById('editStatus').value = item.status;
        document.getElementById('editDataSaida').value = item.dataSaida;
        document.getElementById('editTecDevolveu').value = item.tecnicoDevolveu;
        document.getElementById('editClienteRecebeu').value = item.clienteRecebeu;
        document.getElementById('editTecManutencao').value = item.tecnicoManutencao;
        modalInstanceEditar.show();
      }

      function processarEntrada(e) {
        e.preventDefault(); const btn = document.getElementById("btnSalvarEntrada"); btn.disabled = true; btn.innerHTML = 'Processando...';
        const dados = { cliente: document.getElementById("eqpCliente").value, tecnico: document.getElementById("eqpTecnico").value, celular: document.getElementById("eqpCelular").value, email: document.getElementById("eqpEmail").value, descricao: document.getElementById("eqpDescricao").value, problema: document.getElementById("eqpProblema").value };
        
        chamarBackend('salvarEntradaEquipamento', { dados: dados })
          .then(r => { 
            if(r.sucesso) { modalInstanceEntrada.hide(); carregarTabelaEqp(); }
            mostrarAviso(r.mensagem, r.sucesso ? 'success' : 'error', r.linkZap);
            btn.disabled = false; btn.innerHTML = 'Confirmar Entrada'; 
          })
          .catch(e => {
            mostrarAviso("Erro crítico: " + e.message, 'error');
            btn.disabled = false; btn.innerHTML = 'Confirmar Entrada';
          });
      }

      function processarSaida(e) {
        e.preventDefault(); const btn = document.getElementById("btnSalvarSaida"); btn.disabled = true; btn.innerHTML = 'Baixando...';
        const dados = { linha: document.getElementById("saidaLinha").value, tecEntregou: document.getElementById("saidaTecnico").value, clienteRecebeu: document.getElementById("saidaCliente").value, tecManutencao: document.getElementById("saidaTecManutencao").value };
        
        chamarBackend('registrarSaidaEquipamento', { dados: dados })
          .then(r => { 
            if(r.sucesso) { modalInstanceSaida.hide(); carregarTabelaEqp(); }
            mostrarAviso(r.mensagem, r.sucesso ? 'success' : 'error', r.linkZap);
            btn.disabled = false; btn.innerHTML = 'Concluir Devolução'; 
          })
          .catch(e => {
            mostrarAviso("Erro crítico: " + e.message, 'error');
            btn.disabled = false; btn.innerHTML = 'Concluir Devolução';
          });
      }

      function processarEdicao(e) {
        e.preventDefault(); const btn = document.getElementById("btnSalvarEdicao"); btn.disabled = true; btn.innerHTML = 'Gravando...';
        const dados = { 
          linha: document.getElementById("editLinha").value, dataEntrada: document.getElementById("editDataEntrada").value, clienteEntregou: document.getElementById("editClienteEntregou").value, celular: document.getElementById("editCelular").value, email: document.getElementById("editEmail").value, tecnicoRecebeu: document.getElementById("editTecRecebeu").value, equipamentos: document.getElementById("editEquipamentos").value, problema: document.getElementById("editProblema").value, status: document.getElementById("editStatus").value, dataSaida: document.getElementById("editDataSaida").value, tecnicoDevolveu: document.getElementById("editTecDevolveu").value, clienteRecebeu: document.getElementById("editClienteRecebeu").value, tecnicoManutencao: document.getElementById("editTecManutencao").value
        };
        
        chamarBackend('atualizarEquipamento', { dados: dados })
          .then(r => {
            mostrarAviso(r.mensagem, r.sucesso ? 'success' : 'error');
            if(r.sucesso) { modalInstanceEditar.hide(); carregarTabelaEqp(); }
            btn.disabled = false; btn.innerHTML = 'Gravar Alterações';
          })
          .catch(e => {
            mostrarAviso("Erro crítico: " + e.message, 'error');
            btn.disabled = false; btn.innerHTML = 'Gravar Alterações';
          });
      }

      function excluirRegistroEqp(linha) {
        linhaParaExcluir = linha;
        document.getElementById('modalConfirmacaoBody').innerHTML = `Tem certeza que deseja excluir permanentemente o registro da linha <b>${linha}</b>?`;
        modalConfirmaObj.show();
      }

      document.getElementById('btnConfirmaExclusao').addEventListener('click', function() {
        modalConfirmaObj.hide();
        chamarBackend('excluirEquipamento', { linha: linhaParaExcluir })
          .then(r => {
            mostrarAviso(r.mensagem, r.sucesso ? 'success' : 'error');
            if(r.sucesso) carregarTabelaEqp();
          })
          .catch(e => mostrarAviso("Erro ao excluir: " + e.message, 'error'));
      });
    </script>
  </body>
</html>
